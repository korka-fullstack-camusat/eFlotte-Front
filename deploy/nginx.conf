server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers avec empreinte (assets/*.js, *.css) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html et manifeste : toujours revalidés (nouvelle version visible tout de suite)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Application React : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
