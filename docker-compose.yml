# Front eFlotte (Vite, rechargement à chaud)
#
#   cp .env.example .env      (une seule fois, puis adapter les valeurs)
#   docker compose up --build
#
#   Front → http://localhost:${FRONT_PORT}   (admin / admin123)
#
# Lancer d'abord le backend (docker compose up dans eFlotte-Api).
# Toutes les valeurs viennent du fichier .env (voir .env.example).

name: eflotte-front

services:
  front:
    build: .
    ports:
      - "${FRONT_PORT:-5175}:5175"
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:?Définir VITE_PROXY_TARGET dans .env}
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
