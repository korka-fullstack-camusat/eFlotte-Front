# Front eFlotte
#   Par défaut (FRONT_MODE=production) : site construit et servi sans le code source.
#   Poste de développement : FRONT_MODE=dev dans .env pour le rechargement à chaud.
#
#   cp .env.example .env      (une seule fois, puis adapter les valeurs)
#   docker compose up --build
#
#   Front → http://localhost:${FRONT_PORT}   (admin / admin123)
#
# Lancer d'abord le backend (docker compose up dans eFlotte-Api).
# Toutes les valeurs viennent du fichier .env (voir .env.example).

name: eflotte-front

services:
  front:
    build: .
    container_name: eflotte-front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-5175}:5175"
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:?Définir VITE_PROXY_TARGET dans .env}
      FRONT_MODE: ${FRONT_MODE:-production}
      # Vide = l'API est appelée sur la même adresse que le site (/api relayé)
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5175"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s   # la construction du site prend environ 1 minute
